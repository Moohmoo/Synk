[project]
name = "synk-back"
version = "0.1.0"
description = "Backend temps réel pour la synchronisation vidéo collaborative Synk"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "python-dotenv>=1.0.1",
    "redis[hiredis]>=5.2.0",
    "websockets>=14.0",
    "python-socketio>=5.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "aiohttp>=3.14.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"

