services:
  redis:
    image: redis:7-alpine
    container_name: synk-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - synk-network

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: synk-back
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      # Montage des sources avec hot reload actif
      - ./back:/app
    environment:
      - ENV=development
      - REDIS_URL=redis://redis:6379/0
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - synk-network

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: synk-front
    ports:
      - "3000:3000"
    volumes:
      # Montage des sources Next.js avec hot reload
      - ./front:/app
      # Préservation des dépendances internes au conteneur
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - synk-network

networks:
  synk-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
